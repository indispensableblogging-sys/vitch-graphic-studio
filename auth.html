<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VGS Client Account</title>
<link rel="stylesheet" href="style.css">
<style>
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:radial-gradient(circle at top,#24200f,#0b0b0b 55%)}
.auth-card{width:100%;max-width:520px;background:#151515;border:1px solid rgba(212,175,55,.45);border-radius:22px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.auth-card h1{text-align:center;color:#d4af37;margin-bottom:8px}.auth-card .subtitle{text-align:center;color:#bbb;margin-bottom:25px}
.auth-tabs{display:flex;gap:10px;margin-bottom:25px}.auth-tabs button{flex:1;padding:13px;border-radius:10px;border:1px solid #555;background:#202020;color:#fff;font-weight:700}.auth-tabs button.active{background:#d4af37;color:#111;border-color:#d4af37}
.auth-form{display:none;flex-direction:column;gap:14px}.auth-form.active{display:flex}.auth-form label{color:#d4af37;font-weight:700}.auth-form input{width:100%;padding:15px;border:1px solid #444;border-radius:10px;background:#202020;color:#fff;font-size:16px}.auth-form input:focus{outline:none;border-color:#d4af37}.auth-form button{border:0;cursor:pointer}.auth-message{min-height:28px;text-align:center;margin:18px 0;font-weight:700}.auth-back{text-align:center;margin-top:20px}.auth-back a{color:#d4af37}
</style>
</head>
<body>
<header class="header"><div class="container"><a href="index.html" class="logo">VITCH GRAPHIC STUDIO</a></div></header>
<main class="auth-wrap">
<div class="auth-card">
<h1>VGS Client Portal</h1>
<p class="subtitle">Securely access your projects, bookings and payments.</p>
<div class="auth-tabs">
<button id="show-login" class="active" type="button">Login</button>
<button id="show-signup" type="button">Create Account</button>
</div>
<div id="auth-message" class="auth-message"></div>
<form id="login-form" class="auth-form active">
<label for="login-email">Email</label><input id="login-email" type="email" autocomplete="email" required placeholder="you@example.com">
<label for="login-password">Password</label><input id="login-password" type="password" autocomplete="current-password" required placeholder="Your password">
<button class="btn" type="submit">🔐 Sign In</button>
</form>
<form id="signup-form" class="auth-form">
<label for="signup-name">Full Name</label><input id="signup-name" type="text" autocomplete="name" required placeholder="Your full name">
<label for="signup-email">Email</label><input id="signup-email" type="email" autocomplete="email" required placeholder="you@example.com">
<label for="signup-password">Password</label><input id="signup-password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
<button class="btn" type="submit">✨ Create Client Account</button>
</form>
<p class="auth-back"><a href="index.html">← Back to VGS website</a></p>
</div>
</main>
<script>
const loginTab=document.getElementById('show-login'),signupTab=document.getElementById('show-signup');
const loginForm=document.getElementById('login-form'),signupForm=document.getElementById('signup-form');
loginTab.onclick=()=>{loginTab.classList.add('active');signupTab.classList.remove('active');loginForm.classList.add('active');signupForm.classList.remove('active')};
signupTab.onclick=()=>{signupTab.classList.add('active');loginTab.classList.remove('active');signupForm.classList.add('active');loginForm.classList.remove('active')};
</script>
<script type="module" src="vgs-auth.js"></script>
</body>
</html>
