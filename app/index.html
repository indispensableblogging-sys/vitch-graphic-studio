<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vitch">
  <title>Vitch — Mobile App</title>
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="icon" href="../vgs-app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=2">
  <link rel="stylesheet" href="fix.css?v=2">
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Menu">☰</button>
      <div class="brand-mark">VG</div>
      <button id="bell-btn" class="icon-btn" aria-label="Notifications">♧</button>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-tab="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-tab="projects" class="nav-item"><span>▣</span><small>Projects</small></button>
      <button data-tab="orders" class="nav-item"><span>▤</span><small>Orders</small></button>
      <button data-tab="messages" class="nav-item"><span>◌</span><small>Messages</small></button>
      <button data-tab="profile" class="nav-item"><span>♙</span><small>Profile</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="app.js?v=2"></script>
  <script src="install.js?v=2"></script>
</body>
</html>
